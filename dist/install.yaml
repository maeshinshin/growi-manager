  - growi-manager-webhook-service.growi-manager-system.svc
  - growi-manager-webhook-service.growi-manager-system.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: growi-manager-selfsigned-issuer
  secretName: webhook-server-cert
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: growi-manager
  name: growi-manager-selfsigned-issuer
  namespace: growi-manager-system
spec:
  selfSigned: {}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  annotations:
    cert-manager.io/inject-ca-from: growi-manager-system/growi-manager-serving-cert
  name: growi-manager-validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: growi-manager-webhook-service
      namespace: growi-manager-system
      path: /validate-apps-maesh-dev-v1-growi
  failurePolicy: Fail
  name: vgrowi-v1.kb.io
  rules:
  - apiGroups:
    - apps.maesh.dev
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - growis
  sideEffects: None
