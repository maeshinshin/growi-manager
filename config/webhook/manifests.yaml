---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-apps-maesh-dev-v1-growi
  failurePolicy: Fail
  name: vgrowi-v1.kb.io
  rules:
  - apiGroups:
    - apps.maesh.dev
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - growis
  sideEffects: None
