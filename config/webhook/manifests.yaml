---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-app-maeshinshin-github-io-v1-growi
  failurePolicy: Fail
  name: mgrowi-v1.kb.io
  rules:
  - apiGroups:
    - app.maeshinshin.github.io
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - growis
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-app-maeshinshin-github-io-v1-growi
  failurePolicy: Fail
  name: vgrowi-v1.kb.io
  rules:
  - apiGroups:
    - app.maeshinshin.github.io
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - growis
  sideEffects: None
