apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "growi-manager.fullname" . }}-validating-webhook-configuration
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "growi-manager.fullname" . }}-serving-cert
  labels:
  {{- include "growi-manager.labels" . | nindent 4 }}
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: '{{ include "growi-manager.fullname" . }}-webhook-service'
      namespace: '{{ .Release.Namespace }}'
      path: /validate-apps-maesh-dev-v1-growi
  failurePolicy: Fail
  name: vgrowi-v1.kb.io
  rules:
  - apiGroups:
    - apps.maesh.dev
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - growis
  sideEffects: None
