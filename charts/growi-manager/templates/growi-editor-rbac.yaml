apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "growi-manager.fullname" . }}-growi-editor-role
  labels:
  {{- include "growi-manager.labels" . | nindent 4 }}
rules:
- apiGroups:
  - apps.maesh.dev
  resources:
  - growis
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps.maesh.dev
  resources:
  - growis/status
  verbs:
  - get
